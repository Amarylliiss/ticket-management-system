services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  assets:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    profiles: ["assets"]
    command: sh -c "npm install && npm run build"

volumes:
  mysql-data:
